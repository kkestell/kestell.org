[project]
name = "builder"
version = "0.1.0"
description = "Static site generator for kestell.org"
authors = [
    {name = "Kyle Kestell", email = "kyle@kestell.org"},
]
dependencies = []
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
dev = [
    "markdown>=3.6",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "flask>=3.0.3",
    "watchdog>=4.0.1",
    "python-slugify>=8.0.4",
    "python-recipy>=0.1.3",
]
